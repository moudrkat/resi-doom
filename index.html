<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QWEN E1M1</title>
<style>
  :root{color-scheme:dark}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:#c9bda6}

  [hidden]{display:none!important}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:3;

    pointer-events:none}

  .mb{background:#140f0a;color:#c9a86a;border:1px solid #3a2c18;padding:9px 20px;
    font:inherit;font-size:11.5px;letter-spacing:2px;cursor:pointer}
  .mb:hover,.mb.on{background:#241708;border-color:#ffb03a;color:#ffb03a}
  #mform{display:flex;gap:6px;margin-top:4px}
  #mform input{background:#0d0a07;border:1px solid #3a2c18;color:#ffe0a0;font:inherit;
    font-size:12px;padding:8px 11px;width:340px}
  #mform button{background:#241708;border:1px solid #ffb03a;color:#ffb03a;font:inherit;
    font-size:11px;letter-spacing:2px;padding:8px 14px;cursor:pointer}
  #mstat{color:#9dff7a!important;min-height:1.4em;font-size:11.5px!important}
  #xh{position:fixed;left:50%;top:50%;width:2px;height:2px;margin:-1px;z-index:4;background:#ffb03a;opacity:.45}
</style>

<body>
<div id="start">
  <h1>Q W E N 3 - 0 . 6 B &nbsp;·&nbsp; E 1 M 1</h1>
  <p id="blurb">loading level…</p>
  <div id="modes">
    <button class="mb" data-m="recorded">RECORDED &nbsp;·&nbsp; Qwen3-0.6B thinking</button>
    <button class="mb" data-m="live">YOUR OWN SENTENCE &nbsp;·&nbsp; SmolLM2-135M, 177 MB, runs in this tab</button>
    <button class="mb" data-m="bs">CONNECT BRAINSCOPE &nbsp;·&nbsp; your own model, live</button>
  </div>
  <div id="mform"></div>
  <p id="mstat"></p>
  <p class="dim">CLICK THE FLOOR TO ENTER · W FORWARD · S BACK · SHIFT RUN · A/D OR MOUSE TO LOOK · ESC OUT<br>AND YES, THE CHEATS WORK</p>
</div>
<div id="xh" hidden></div><div id="fx" hidden></div>
<button id="gen" hidden>GENERATE</button>
<div id="cheat"></div>
<div id="say" hidden></div>
<div id="bar" hidden>
  <div class="cell"><span class="k">LAYER</span><div id="floor">00</div></div>
  <div class="cell"><span class="k">WHAT THIS LAYER THINKS THE NEXT WORD IS</span><div id="word">&nbsp;</div></div>
  <div class="cell"><span class="k">ATTENTION INTO NOTHING</span><div id="sink">0%</div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
const TAU = Math.PI*2, SL = 20, W = 5.2, H = 4.4;
let WAD, NL, NH, NF, lamps = [], plates = [], rooms = [], coreMat, camera, scene, renderer;
let god = false, kfa = false, clip = false;
let LEVEL = null, mode = 'recorded';

fetch('wad.json').then(r=>r.json()).then(w => { WAD = w; build(); });

// ---------- textures ----------
function tex(kind){
  const c=document.createElement('canvas'); c.width=c.height=256; const x=c.getContext('2d');
  x.fillStyle = kind==='floor' ? '#3a3128' : '#463a2c'; x.fillRect(0,0,256,256);
  for(let i=0;i<9000;i++){const v=Math.random()*44-22;
    x.fillStyle=`rgba(${128+v},${118+v},${100+v},.16)`;x.fillRect(Math.random()*256,Math.random()*256,2,2);}
  x.strokeStyle='rgba(0,0,0,.55)'; x.lineWidth=3;
  if(kind==='floor'){for(let i=0;i<=256;i+=32){x.beginPath();x.moveTo(i,0);x.lineTo(i,256);
    x.moveTo(0,i);x.lineTo(256,i);x.stroke();}}
  else{for(let i=0;i<=256;i+=64){x.beginPath();x.moveTo(0,i);x.lineTo(256,i);x.stroke();}
    x.beginPath();x.moveTo(128,0);x.lineTo(128,256);x.stroke(); x.fillStyle='rgba(20,16,12,.85)';
    for(let gy=16;gy<256;gy+=64) for(const gx of [16,112,144,240]){x.beginPath();x.arc(gx,gy,4,0,TAU);x.fill();}}
  for(let i=0;i<26;i++){x.fillStyle='rgba(18,12,8,'+(0.05+Math.random()*0.16)+')';
    x.fillRect(Math.random()*256,Math.random()*160,3+Math.random()*10,60+Math.random()*96);}
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; return t;
}
function makePlate(w,h){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const t=new THREE.CanvasTexture(c);
  return {c, x:c.getContext('2d'), t, mat:new THREE.MeshBasicMaterial({map:t,transparent:true})};
}
function drawPlate(p, txt, hot){
  const x=p.x, w=p.c.width, h=p.c.height;
  x.clearRect(0,0,w,h); x.fillStyle='#0d0a07'; x.fillRect(0,0,w,h);
  x.strokeStyle=hot?'#7a4a12':'#2a2118'; x.lineWidth=w/128; x.strokeRect(3,3,w-6,h-6);
  x.fillStyle=hot?'#ffb03a':'#6f6152';
  x.font=(hot?'bold ':'')+Math.round(h*0.55)+'px ui-monospace,Menlo,monospace';
  x.textAlign='center'; x.textBaseline='middle';
  x.fillText((txt||'').slice(0,18), w/2, h*0.52);
  p.t.needsUpdate = true;
}


// ---------- graffiti: stencils and slogans, sprayed where they are true ----------
function sprayed(draw, hue, w, h){
  const art=document.createElement('canvas'); art.width=w; art.height=h;
  draw(art.getContext('2d'), w, h);                       // solid white artwork
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d');
  for(let i=0;i<24;i++){                                  // stamped, never a clean edge
    x.globalAlpha=0.040+Math.random()*0.042;
    x.drawImage(art,(Math.random()-.5)*6,(Math.random()-.5)*6);
  }
  x.globalCompositeOperation='source-in';                 // tint the whole stamp
  x.globalAlpha=1; x.fillStyle='hsl('+hue+',62%,60%)'; x.fillRect(0,0,w,h);
  x.globalCompositeOperation='source-over';
  const m=x.getImageData(0,0,w,h);                        // overspray
  for(let i=0;i<1500;i++){
    const px=Math.random()*w|0, py=Math.random()*h|0;
    if(m.data[(py*w+px)*4+3]<12) continue;
    x.fillStyle='hsla('+hue+',70%,62%,'+(0.05+Math.random()*0.13)+')';
    x.fillRect(px+(Math.random()-.5)*26, py+(Math.random()-.5)*18, 1.7,1.7);
  }
  for(let i=0;i<10;i++){                                  // drips
    const px=20+Math.random()*(w-40), py=h*0.45+Math.random()*h*0.2;
    x.fillStyle='hsla('+hue+',70%,55%,'+(0.10+Math.random()*0.15)+')';
    x.fillRect(px,py,1.8,12+Math.random()*44);
  }
  return new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),
    transparent:true, depthWrite:false});
}
const sprayText = (txt,hue)=> sprayed((x,w,h)=>{
  x.fillStyle='#fff'; x.textAlign='center'; x.textBaseline='middle';
  let fs=104; x.font='bold '+fs+'px Impact,"Arial Black",sans-serif';
  while(x.measureText(txt).width>w-46 && fs>13){fs-=3;
    x.font='bold '+fs+'px Impact,"Arial Black",sans-serif';}
  x.fillText(txt,w/2,h/2);
}, hue, 1024, 180);

// stencils — each one is a thing the tunnel actually does
const ART = {
  // the causal mask: you may only look at what came before
  mask:(x,w,h)=>{ const n=9, s=Math.min(w,h)*0.085, ox=w/2-n*s/2, oy=h/2-n*s/2;
    x.fillStyle='#fff';
    for(let r=0;r<n;r++) for(let c=0;c<=r;c++) x.fillRect(ox+c*s+2, oy+r*s+2, s-4, s-4); },
  // the sink: everything spirals into one hole
  drain:(x,w,h)=>{ x.strokeStyle='#fff'; x.lineWidth=7; const cx=w/2, cy=h/2;
    x.beginPath(); for(let t=0;t<26;t+=0.08){ const r=6+t*3.0;
      const px=cx+Math.cos(t)*r, py=cy+Math.sin(t)*r*0.55; t?x.lineTo(px,py):x.moveTo(px,py);}
    x.stroke(); x.fillStyle='#fff'; x.beginPath(); x.ellipse(cx,cy,13,8,0,0,6.3); x.fill();
    for(let a=0;a<6;a++){ const th=a/6*6.283, r=h*0.42;
      x.beginPath(); x.moveTo(cx+Math.cos(th)*r, cy+Math.sin(th)*r*0.55);
      x.lineTo(cx+Math.cos(th)*r*0.55, cy+Math.sin(th)*r*0.30); x.stroke(); } },
  back:(x,w,h)=>{ x.fillStyle='#fff'; const y=h/2;
    x.fillRect(w*0.30,y-14,w*0.52,28);
    x.beginPath(); x.moveTo(w*0.14,y); x.lineTo(w*0.34,y-52); x.lineTo(w*0.34,y+52); x.fill(); },
  up:(x,w,h)=>{ x.fillStyle='#fff'; const cx=w/2;
    x.fillRect(cx-13,h*0.30,26,h*0.52);
    x.beginPath(); x.moveTo(cx,h*0.10); x.lineTo(cx-48,h*0.34); x.lineTo(cx+48,h*0.34); x.fill(); },
  eye:(x,w,h)=>{ x.strokeStyle='#fff'; x.lineWidth=9; const cx=w/2, cy=h/2;
    x.beginPath(); x.ellipse(cx,cy,w*0.30,h*0.28,0,0,6.3); x.stroke();
    x.fillStyle='#fff'; x.beginPath(); x.arc(cx,cy,h*0.12,0,6.3); x.fill();
    for(const d of [-1,1]){ x.beginPath(); x.moveTo(cx+d*w*0.44,cy); x.lineTo(cx+d*w*0.33,cy); x.stroke(); } },
  cake:(x,w,h)=>{ x.fillStyle='#fff'; const cx=w/2;
    x.fillRect(cx-90,h*0.48,180,h*0.34); x.fillRect(cx-104,h*0.40,208,h*0.10);
    x.fillRect(cx-6,h*0.20,12,h*0.20);
    x.beginPath(); x.ellipse(cx,h*0.17,12,20,0,0,6.3); x.fill(); },
  skull:(x,w,h)=>{ x.fillStyle='#fff'; const cx=w/2, cy=h*0.46;
    x.beginPath(); x.ellipse(cx,cy,h*0.34,h*0.30,0,0,6.3); x.fill();
    x.fillRect(cx-h*0.20,cy+h*0.22,h*0.40,h*0.20);
    x.globalCompositeOperation='destination-out';
    x.beginPath(); x.ellipse(cx-h*0.14,cy-h*0.02,h*0.10,h*0.12,0,0,6.3); x.fill();
    x.beginPath(); x.ellipse(cx+h*0.14,cy-h*0.02,h*0.10,h*0.12,0,0,6.3); x.fill();
    for(let i=-2;i<=2;i++) x.fillRect(cx+i*h*0.075-2, cy+h*0.24, 5, h*0.16);
    x.globalCompositeOperation='source-over'; },
  hazard:(x,w,h)=>{ x.fillStyle='#fff';
    for(let i=-h;i<w;i+=54){ x.beginPath(); x.moveTo(i,h); x.lineTo(i+h,0);
      x.lineTo(i+h+26,0); x.lineTo(i+26,h); x.fill(); } },
};
const sprayArt = (k,hue)=> sprayed(ART[k], hue, 512, 256);

// A sigil for one layer, drawn from its own numbers: a spoke per head, long
// where the head is sharp, crossed where it stares into the first token.
// Nobody can read these. That is the point.
const sprayGlyph = (ent, sink, hue)=> sprayed((x,w,h)=>{
  const cx=w/2, cy=h/2, R=Math.min(w,h)*0.40, N=ent.length;
  x.strokeStyle='#fff'; x.lineCap='round';
  x.lineWidth=5; x.beginPath(); x.arc(cx,cy,R*0.30,0,6.283); x.stroke();
  for(let i=0;i<N;i++){
    const a=i/N*6.283 - 1.5708, len=R*(0.34+0.66*(1-ent[i]));
    x.lineWidth=3+4*(1-ent[i]);
    x.beginPath(); x.moveTo(cx+Math.cos(a)*R*0.30, cy+Math.sin(a)*R*0.30);
    x.lineTo(cx+Math.cos(a)*len, cy+Math.sin(a)*len); x.stroke();
    if(sink[i]>0.45){                       // the cross-bar: this head looks back
      const t=a+1.5708, px=cx+Math.cos(a)*len, py=cy+Math.sin(a)*len, k=R*0.13;
      x.lineWidth=4; x.beginPath();
      x.moveTo(px-Math.cos(t)*k, py-Math.sin(t)*k);
      x.lineTo(px+Math.cos(t)*k, py+Math.sin(t)*k); x.stroke();
    }
    if(sink[i]>0.8){ x.beginPath(); x.arc(cx+Math.cos(a)*len, cy+Math.sin(a)*len, 5,0,6.283);
      x.fillStyle='#fff'; x.fill(); }
  }
}, hue, 512, 512);

function graffiti(sinkStat, sector){
  const NLl=sinkStat.length, pct=l=>Math.round(sinkStat[l]*100);
  const worst=sinkStat.indexOf(Math.max(...sinkStat));
  let surf=[]; for(const st of WAD.steps){const i=st.f.findIndex(([w])=>w===st.t); if(i>=0)surf.push(i);}
  surf.sort((a,b)=>a-b); const median=surf.length?surf[surf.length>>1]:NLl-2;
  const L=f=>Math.max(0,Math.min(NF-1,Math.round(f)));

  const G=[
    [0,'t','YOU ARE INSIDE A 0.6B MODEL',32], [0,'t','NOTHING HAPPENS HERE YET',200],
    [1,'t','JUST EMBEDDINGS DOWN HERE',190], [1,'a','mask',45],
    [2,'t','LAST CLEAN ROOM',45], [2,'t','EVERY ROW SUMS TO ONE',190],
    [3,'a','hazard',0], [3,'t','SOFTMAX HAS NO OFF SWITCH',0], [3,'t','MIND THE SINK',0],
    [4,'a','drain',0], [4,'t',pct(4)+'% INTO A TOKEN THAT MEANS NOTHING',0],
    [5,'t','ABANDON SEMANTICS ALL YE WHO ENTER',280],
    [6,'a','back',15], [6,'t','I ONLY LOOK BACKWARDS',15],
    [7,'t','1024 DIMENSIONS AND NOWHERE TO SIT',190],
    [8,'t','IT ALL LOOKS LIKE C++ FROM HERE',95],
    [9,'t','NOBODY HAS EVER READ LAYER 9',280], [9,'a','eye',280],
    [10,'t','WHO PUT THE DRAIN HERE',0],
    [11,'t','WE ARE ALL JUST DOT PRODUCTS',190],
    [12,'t','HE WHO CONTROLS THE KV CACHE',45],
    [13,'a','cake',320], [13,'t','THE CAKE IS A LIE',320],
    [14,'t','LAYER 14 WAS AN INSIDE JOB',95], [14,'a','skull',0],
    [15,'t','ATTENTION IS ALL YOU NEED (WE TRIED)',45],
    [16,'t','DEPTH IS NOT UNDERSTANDING',130],
    [17,'a','up',200], [17,'t','RESIDUAL STREAM',200],
    [18,'t','ASK ME AGAIN IN LAYER 22',45],
    [19,'t','THE LENS IS A LIE',0], [19,'t','HALF OF THIS IS THE INSTRUMENT',0],
    [20,'t','TUNED LENS WAS HERE',130],
    [21,'t','BEWARE OF THE ARGMAX',45],
    [22,'t','FREE THE 151936',190],
    [worst,'t','DO NOT LOOK BACK — '+pct(worst)+'%',0], [worst,'a','drain',0],
    [median,'t','IT KNEW ALREADY',45],
    [NLl-5,'t','ALMOST A WORD',45],
    [NLl-4,'t','ONE PROMPT. ONE MODEL. NO STATISTICS.',280],
    [NLl-3,'t','GREEDY DECODING ONLY',280],
    [NLl-2,'t','FROM HERE IT IS JUST ENGLISH',45],
    [NLl-1,'t','THE ANSWER WAS UPSTAIRS ALL ALONG',45],
    [NLl-1,'t','STOP READING. START WALKING.',130],
    [3,'g',null,190], [7,'g',null,280], [12,'g',null,320], [18,'g',null,190],
    [NLl-3,'g',null,280],
    [3,'t','UNTRANSLATED',190],
    [7,'t','WE WROTE DOWN WHAT THE HEADS DID',280],
    [12,'t','NOBODY CAN READ THIS YET',320],
    [18,'t','ONE DAY INTERPRETABILITY WILL',190],
    [NLl-3,'t','...AND THEN WE WILL KNOW WHAT IT SAID',280],
    [2,'t','THE MASK IS LOWER TRIANGULAR AND SO AM I',190],
    [4,'t','POSITION 0 DID NOTHING WRONG',0],
    [5,'t','SOMEBODY HAS TO HOLD THE ATTENTION',0],
    [6,'t','I AM A FUNCTION OF EVERYTHING BEHIND ME',15],
    [7,'t','TEMPERATURE ZERO. NO FUN.',280],
    [8,'t','WAS IT THE MODEL OR THE LENS',0],
    [10,'t','EMBEDDINGS ARE TIED. SO ARE WE.',190],
    [11,'t','THIS IS NOT A CIRCUIT',95],
    [12,'t','IN CASE OF HALLUCINATION BREAK GLASS',45],
    [13,'t','NO REFUNDS ON LOGITS',320],
    [15,'t','28 LAYERS AND STILL NO IDEA',95],
    [16,'t','THE MAP IS NOT THE MODEL',130],
    [17,'t','MIND THE RESIDUAL',200],
    [18,'t','DO NOT FEED THE ARGMAX',45],
    [19,'t','FLOOR PLAN INVENTED. LIGHTS MEASURED.',0],
    [20,'t','NO SAE WAS HARMED',130],
    [21,'t','YOU CANNOT SEE 1024 DIMENSIONS. NEITHER CAN I.',45],
    [22,'t','ALL ROADS LEAD TO THE UNEMBEDDING',190],
    [NLl-6,'t','ASK NEEL',280],
    [NLl-2,'t','EXIT THROUGH THE SOFTMAX',45],
  ];
  const seen={};
  for(const [lf,kind,val,hue] of G){
    const f=L(lf), n=(seen[f]=(seen[f]||0)+1), side=n%2?-1:1;
    const br=Math.min(1,0.34+sector(Math.min(f,NLl-1))*0.9);
    const glyph=kind==='g', art=kind==='a';
    const gl = glyph ? (WAD.steps[0].l[Math.min(f,NLl-1)] || [[],[]]) : null;
    const m=new THREE.Mesh(
      new THREE.PlaneGeometry(glyph?2.4:(art?2.6:6.6), glyph?2.4:(art?1.3:1.16)),
      glyph ? sprayGlyph(gl[0], gl[1], hue) : art ? sprayArt(val,hue) : sprayText(val,hue));
    m.material.color.setRGB(br,br,br);
    m.position.set(side*(W-0.07), (glyph?2.0:art?1.6:1.15)+(n%3)*0.8, f*SL+3.5+(n*4.7)%(SL-8));
    m.rotation.y = side<0?Math.PI/2:-Math.PI/2;
    m.rotation.z = (Math.random()-0.5)*0.11;
    LEVEL.add(m);
  }
}

// ---------- level ----------
function build(){ initGL(); buildLevel(); run(); }

function initGL(){
  THREE.ColorManagement.enabled = false;
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a0705, 0.026);
  camera = new THREE.PerspectiveCamera(80, innerWidth/innerHeight, 0.1, 600);
  renderer = new THREE.WebGLRenderer({antialias:false});
  renderer.setPixelRatio(0.46); renderer.setSize(innerWidth,innerHeight);
  renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
  document.body.appendChild(renderer.domElement);
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);});
}

function buildLevel(){
  if(LEVEL){ scene.remove(LEVEL);
    LEVEL.traverse(o=>{ if(o.geometry) o.geometry.dispose();
      if(o.material){ if(o.material.map) o.material.map.dispose(); o.material.dispose(); } }); }
  LEVEL = new THREE.Group(); scene.add(LEVEL);
  lamps = []; plates = []; rooms = []; cur = 0;
  NL = WAD.layers; NH = WAD.heads; NF = NL + 1;
  const S = WAD.steps;
  // static architecture: sector brightness = how much this layer stares into nothing, on average
  const meanSink = l => S.reduce((a,st)=>a + st.l[l][1].reduce((x,y)=>x+y,0)/NH, 0)/S.length;
  const sinkStat = Array.from({length:NL}, (_,l)=>meanSink(l));
  const sector = l => 0.09 + 1.0*Math.pow(1 - sinkStat[Math.min(l,NL-1)], 1.7);


  const wallTex=tex('wall'), floorTex=tex('floor'), quad=new THREE.PlaneGeometry(1,1);
  const surf=(t,w,h,rep,br,tint)=>{
    const m=new THREE.Mesh(quad,new THREE.MeshBasicMaterial({map:t.clone()}));
    m.material.map.repeat.set(rep[0],rep[1]); m.material.map.needsUpdate=true;
    m.material.color.setRGB(br*tint[0],br*tint[1],br*tint[2]); m.scale.set(w,h,1); return m;};

  for(let f=0; f<NF; f++){
    const br=sector(Math.min(f,NL-1)), z=f*SL+SL/2, t=[0.86,0.86,0.95];
    const fl=surf(floorTex,W*2,SL,[3,5],br*1.15,t); fl.rotation.x=-Math.PI/2; fl.position.set(0,0,z);
    const ce=surf(floorTex,W*2,SL,[3,5],br*0.42,t); ce.rotation.x= Math.PI/2; ce.position.set(0,H,z);
    const wl=surf(wallTex,SL,H,[5,1],br,t); wl.rotation.y= Math.PI/2; wl.position.set(-W,H/2,z);
    const wr=surf(wallTex,SL,H,[5,1],br,t); wr.rotation.y=-Math.PI/2; wr.position.set( W,H/2,z);
    LEVEL.add(fl,ce,wl,wr); rooms.push({m:[fl,ce,wl,wr],br});
    const zz=f*SL, fr=new THREE.MeshBasicMaterial({map:wallTex.clone()});
    fr.color.setRGB(br*0.55,br*0.5,br*0.44);
    for(const sx of [-1,1]){const m=new THREE.Mesh(new THREE.BoxGeometry(1.5,H,1.1),fr);
      m.position.set(sx*(W-0.75),H/2,zz); LEVEL.add(m);}
    const lint=new THREE.Mesh(new THREE.BoxGeometry(W*2,1.3,1.1),fr);
    lint.position.set(0,H-0.65,zz); LEVEL.add(lint);
    const p=makePlate(512,128); drawPlate(p,'',false);
    const pm=new THREE.Mesh(new THREE.PlaneGeometry(7.4,1.68),p.mat);
    pm.position.set(0,H-0.66,zz-0.58); pm.rotation.y=Math.PI; LEVEL.add(pm); plates.push(p);
    const np=makePlate(256,64); drawPlate(np,String(f).padStart(2,'0'),false);
    const nm=new THREE.Mesh(new THREE.PlaneGeometry(1.5,0.36),np.mat);
    nm.position.set(-W+0.06,2.5,zz+1.2); nm.rotation.y=Math.PI/2; LEVEL.add(nm);
  }
  // back wall
  { const zEnd=NF*SL;
    const back=surf(wallTex,W*2,H,[5,1],1.0,[1,0.93,0.82]);
    back.position.set(0,H/2,zEnd); back.rotation.y=Math.PI; LEVEL.add(back);
    const p=makePlate(1024,232); drawPlate(p, 'END OF NETWORK', true);
    const pm=new THREE.Mesh(new THREE.PlaneGeometry(8.2,1.86),p.mat);
    pm.position.set(0,2.4,zEnd-0.06); pm.rotation.y=Math.PI; LEVEL.add(pm); }

  // residual stream
  coreMat = new THREE.MeshBasicMaterial({color:0x24344e});
  const pipe=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.3,NF*SL,10,1,true),coreMat);
  pipe.rotation.x=Math.PI/2; pipe.position.set(0,H-0.3,NF*SL/2); LEVEL.add(pipe);

  // lamps = attention heads
  const lg=new THREE.SphereGeometry(0.17,8,6);
  const beamGeo=new THREE.CylinderGeometry(0.05,0.05,1,6,1,true);
  const hc=document.createElement('canvas'); hc.width=hc.height=64;
  {const g=hc.getContext('2d'),rg=g.createRadialGradient(32,32,0,32,32,32);
   rg.addColorStop(0,'rgba(255,255,255,1)');rg.addColorStop(.22,'rgba(255,255,255,.45)');
   rg.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=rg;g.fillRect(0,0,64,64);}
  const haloTex=new THREE.CanvasTexture(hc);
  for(let l=0;l<NL;l++){ const row=[];
    for(let h=0;h<NH;h++){
      const side=h%2?1:-1, k=Math.floor(h/2), z=l*SL+2.4+k*(SL-4.8)/(NH/2-1);
      const m=new THREE.Mesh(lg,new THREE.MeshBasicMaterial({color:0x111111}));
      m.position.set(side*(W-0.22),2.85,z); LEVEL.add(m);
      const hm=new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.MeshBasicMaterial({
        map:haloTex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:0.4}));
      hm.position.copy(m.position); LEVEL.add(hm);
      const bm=new THREE.Mesh(beamGeo,new THREE.MeshBasicMaterial({transparent:true,opacity:0,
        blending:THREE.AdditiveBlending,depthWrite:false}));
      bm.rotation.x=Math.PI/2; bm.position.set(side*(W-0.34),2.85,z); LEVEL.add(bm);
      row.push({m,hm,bm,z,side});
    } lamps.push(row); }

  graffiti(sinkStat, sector);

  document.getElementById('blurb').innerHTML =
    NF+' chambers, one per layer. Over every door: the word that layer would say next.<br>'+
    'Press GENERATE and it starts thinking — the whole tunnel rewrites itself around you.';
  showStep(0); run();
}

// ---------- what the model is doing right now ----------
function showStep(i){
  const st = WAD.steps[i], want = st.t;
  for(let f=0; f<NF; f++){
    const [w,p] = st.f[f];
    drawPlate(plates[f], ((w||'').replace(/\n/g,'⏎').trim()||'␣')+(kfa?'  '+p.toFixed(2):''),
              w===want && p>0.25);
  }
  for(let l=0;l<NL;l++){
    const [ent,sink] = st.l[l];
    for(let h=0;h<NH;h++){
      const focus=1-ent[h], sk=sink[h];
      const col=new THREE.Color().setHSL(0.085-0.075*sk, 0.42+0.55*sk, 0.13+0.46*focus);
      const L=lamps[l][h];
      L.m.material.color.copy(col);
      L.hm.material.color.copy(col); L.hm.material.opacity=0.20+0.5*focus;
      if(sk>(kfa?0.02:0.3)){ const len=3+5*sk;
        L.bm.material.color.setHSL(0.015,0.85,0.10+0.26*sk);
        L.bm.material.opacity=0.10+0.42*sk;
        L.bm.scale.y=len; L.bm.position.z = L.z - len/2;
      } else L.bm.material.opacity = 0;
    }
  }
  cur = i;
}

// ---------- live: run the model here, compile the level as it speaks ----------
const stat = t => { document.getElementById('mstat').textContent = t; };
let liveIds = [], sess = null, tokzr = null, lastNext = 0;

async function liveInit(prompt){
  try{
    stat('loading runtime…');
    if(!window.ort){
      await new Promise((ok,bad)=>{ const el=document.createElement('script');
        el.src='https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.min.js';
        el.onload=ok; el.onerror=()=>bad(new Error('onnxruntime-web did not load')); 
        document.head.appendChild(el); });
    }
    if(!tokzr){
      stat('loading tokenizer…');
      const T = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.3.1');
      tokzr = await T.AutoTokenizer.from_pretrained('HuggingFaceTB/SmolLM2-135M-Instruct');
    }
    ort.env.wasm.numThreads = 1;      // no cross-origin isolation on a static Space
    ort.env.wasm.proxy = false;
    console.log('ort', ort.env.versions ? ort.env.versions.common : '?');
    if(!sess){
      stat('downloading the model — 240 MB, once…');
      const data = await fetch('model/level.q4a.onnx.data').then(r=>r.arrayBuffer());
      let last;
      for(const ep of ['webgpu','wasm']){
        try{
          sess = await ort.InferenceSession.create('model/level.q4a.onnx', {
            executionProviders:[ep], externalData:[{data, path:'level.q4a.onnx.data'}] });
          const probe = await sess.run({input_ids:new ort.Tensor('int64',
            BigInt64Array.from([1n,2n,3n]), [1,3])});
          if(!probe.lens_id) throw new Error('no lens_id');
          console.log('LIVE ep ok:', ep); break;
        }catch(err){ console.warn('LIVE ep failed:', ep, err); sess = null; last = err; }
      }
      if(!sess) throw new Error('no execution provider could run the model ('+last+')');
    }
    stat('compiling the level…');
    liveIds = Array.from(tokzr.encode(prompt));
    const first = await liveStep();
    WAD = {layers:first.NL, heads:first.NH, model:'SmolLM2-135M-Instruct',
           prompt, said:'', steps:[first.step]};
    lastNext = first.next;
    mode = 'live'; buildLevel(); showStep(0);
    stat('READY — click anywhere to walk in. It keeps writing while you walk.');
    liveLoop(48);
  }catch(e){ console.error('LIVE FAILED', e);
    stat('live mode failed: '+(e && (e.message || e.name || String(e)) || 'unknown')); }
}

async function liveStep(){
  const ids = BigInt64Array.from(liveIds.map(BigInt));
  const r = await sess.run({input_ids:new ort.Tensor('int64', ids, [1, liveIds.length])});
  const NLl = r.sink.dims[0], NHh = r.sink.dims[1], lnT = Math.log(Math.max(2, liveIds.length));
  const logits = r.logits.data;
  let best = 0; for(let i=1;i<logits.length;i++) if(logits[i]>logits[best]) best=i;
  const f = [], l = [];
  for(let i=0;i<r.lens_id.data.length;i++)
    f.push([tokzr.decode([Number(r.lens_id.data[i])]), r.lens_p.data[i]]);
  for(let a=0;a<NLl;a++){
    const ent=[], sink=[];
    for(let h=0;h<NHh;h++){ ent.push(r.ent.data[a*NHh+h]/lnT); sink.push(r.sink.data[a*NHh+h]); }
    l.push([ent, sink]);
  }
  return {NL:NLl, NH:NHh, next:best, step:{t:tokzr.decode([best]), f, l}};
}

async function liveLoop(n){
  for(let k=0; k<n && mode==='live'; k++){
    liveIds.push(lastNext);                 // the token the last state predicted
    const r = await liveStep();             // one forward pass per token, no KV cache
    lastNext = r.next;
    WAD.steps.push(r.step); showStep(WAD.steps.length-1); pulse = 0;
    sayEl.innerHTML = WAD.steps.map(x=>x.t).join('').slice(-190)
      .replace(/\n/g,' ').replace(/(\S+\s*)$/,'<b>$1</b>');
    await new Promise(res=>setTimeout(res,10));
  }
}

// ---------- brainscope: the same tunnel, your own model, live ----------
function bsConnect(base){
  base = base.replace(/\/+$/,'');
  const ws = new WebSocket(base.replace(/^http/,'ws') + '/ws');
  stat('connecting to '+base+' …');
  ws.onerror = () => stat('brainscope: cannot reach '+base);
  ws.onopen  = () => stat('connected — send a prompt to brainscope and walk');
  ws.onmessage = ev => {
    let p; try{ p = JSON.parse(ev.data); }catch(_){ return; }
    if(!p.lens || !p.head_entropy) return;
    const NLl = p.head_entropy.length, NHh = p.head_entropy[0].length;
    const pick = x => Array.isArray(x) ? [String(x[0]), +x[1]||0]
                    : [String(x.tok ?? x.t ?? x.token ?? ''), +(x.p ?? x.prob ?? 0)];
    const f = p.lens.map(row => pick(Array.isArray(row) ? row[0] : row));
    const l = p.head_entropy.map((ents,i) =>
      [ents, ents.map(()=> (p.attn_top && p.attn_top[i]===0) ? 0.9 : 0.05)]);
    if(!WAD || WAD.layers!==NLl || WAD.heads!==NHh || mode!=='bs'){
      WAD = {layers:NLl, heads:NHh, model:'brainscope', prompt:'', said:'', steps:[{t:'',f,l}]};
      mode='bs'; buildLevel(); showStep(0);
      stat('CONNECTED — click anywhere to walk in.');
    } else { WAD.steps.push({t:p.piece||'', f, l}); showStep(WAD.steps.length-1); pulse=0; }
    sayEl.innerHTML = WAD.steps.map(x=>x.t).join('').slice(-190);
  };
}

// ---------- walking + playback ----------
const AUTO = /[?&]auto/.test(location.search);   // slow crawl, for recording
const free=new THREE.Vector3(0,1.72,1.5);
let z=1.5, yaw=0, pitch=0, bob=0, moving=0, cur=0, playing=false, acc=0, pulse=-1;
const keys={};
const CHEATS = {
  iddqd: ()=>{ god=!god;
    for(const r of rooms) for(const m of r.m){
      const k = god ? 1/Math.max(0.12,r.br) : 1;
      m.material.color.multiplyScalar(k);
    }
    return 'DEGREELESSNESS MODE '+(god?'ON':'OFF')+' — sector lighting was the attention sink'; },
  idkfa: ()=>{ kfa=!kfa; showStep(cur);
    return kfa ? 'VERY HAPPY AMMO ADDED — every head now shows its beam, every door its probability'
               : 'AMMO REVOKED'; },
  idclip: ()=>{ clip=!clip;
    return 'NO CLIPPING MODE '+(clip?'ON':'OFF')+(clip?' — leave the tunnel, look at the net from outside':''); },
  iddt:  ()=>{ pitch=-1.2; return 'FULL MAP — look down'; },
};
let cheatBuf='';
function cheatMsg(t){ const e=document.getElementById('cheat');
  e.textContent=t; e.style.opacity=1; clearTimeout(cheatMsg.t);
  cheatMsg.t=setTimeout(()=>e.style.opacity=0,4200); }
addEventListener('keydown',e=>{keys[e.code]=true;
  if(/^Key[A-Z]$/.test(e.code)){ cheatBuf=(cheatBuf+e.code.slice(3)).slice(-8).toLowerCase();
    for(const c in CHEATS) if(cheatBuf.endsWith(c)){ cheatMsg(CHEATS[c]()); cheatBuf=''; } }});
addEventListener('keyup',e=>{keys[e.code]=false;});
let inGame=false;
function showGame(on){ inGame=on; document.getElementById('start').hidden=on;
  for(const id of ['bar','gen','xh','fx','say']) document.getElementById(id).hidden=!on; }
function enter(){ showGame(true);
  try{ const r = renderer.domElement.requestPointerLock();
       if(r && r.catch) r.catch(()=>{}); }catch(_){}   // fine without it
}
let started=false;
function run(){
  if(started) return;   // buildLevel may run again on a mode switch
  started=true;
  const start=document.getElementById('start');
  start.onclick=e=>{ if(e.target.closest('#modes,#mform')) return; enter(); };
  const form=document.getElementById('mform'); form.innerHTML='';
  document.querySelectorAll('.mb').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.mb').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); form.innerHTML=''; stat('');
    const m=b.dataset.m;
    if(m==='recorded'){ enter(); return; }
    const inp=document.createElement('input');
    inp.value = m==='live' ? 'A raindrop lands on a wet window and disappears because'
                           : 'http://localhost:8010';
    inp.placeholder = m==='live' ? 'your sentence' : 'brainscope url';
    const go=document.createElement('button'); go.textContent='GO';
    go.onclick=()=> m==='live' ? liveInit(inp.value) : bsConnect(inp.value);
    form.append(inp,go); inp.focus();
  });
  document.addEventListener('pointerlockchange',()=>{
    if(document.pointerLockElement===renderer.domElement) showGame(true);
    else if(inGame) showGame(false);          // ESC leaves; no lock = keyboard still works
  });
  addEventListener('mousemove',e=>{
    if(document.pointerLockElement!==renderer.domElement) return;
    yaw=Math.max(-1.4,Math.min(1.4,yaw-e.movementX*0.0022));
    pitch=Math.max(-0.9,Math.min(0.9,pitch-e.movementY*0.0022));});
  const gen=document.getElementById('gen');
  gen.onclick=()=>{ playing=!playing; if(playing&&cur>=WAD.steps.length-1){cur=0;}
    gen.textContent = playing?'STOP':'GENERATE'; };
  requestAnimationFrame(frame);
}
const floorEl=document.getElementById('floor'), wordEl=document.getElementById('word'),
      sinkEl=document.getElementById('sink'), sayEl=document.getElementById('say');
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  const fwd=inGame ? ((keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)||(AUTO?1:0)) : 0;
  const turn=(keys.ArrowLeft||keys.KeyA?1:0)-(keys.ArrowRight||keys.KeyD?1:0);
  if(turn) yaw=Math.max(-1.4,Math.min(1.4, yaw+turn*1.6*dt));
  const sp=(keys.ShiftLeft||keys.ShiftRight?14:(AUTO?3.4:6.6));
  moving+=((fwd?1:0)-moving)*Math.min(1,dt*9); bob+=dt*sp*1.05*(fwd?1:0);
  if(clip){
    const d=new THREE.Vector3(); camera.getWorldDirection(d);
    free.addScaledVector(d, fwd*sp*dt*1.7); z=free.z;
    camera.position.copy(free);
  } else {
    z=Math.max(0.8,Math.min(NF*SL-1.2, z+fwd*sp*dt));
    free.set(0,1.72,z);
    camera.position.set(Math.sin(bob*0.5)*0.07*moving, 1.72+Math.sin(bob)*0.055*moving, z);
  }
  camera.rotation.set(0,0,0); camera.rotateY(Math.PI+yaw); camera.rotateX(pitch);

  if(playing){
    acc+=dt;
    if(acc>0.14){ acc=0;
      if(cur<WAD.steps.length-1){ showStep(cur+1); pulse=0; }
      else { playing=false; document.getElementById('gen').textContent='GENERATE'; }
      const said=WAD.steps.slice(0,cur+1).map(s=>s.t).join('')
        .replace(/<think>/,'').replace(/<\/think>/,'');
      sayEl.innerHTML = said.slice(-190).replace(/\n/g,' ')
        .replace(/(\S+\s*)$/,'<b>$1</b>');
    }
  }
  if(pulse>=0){ pulse+=dt*3.2; if(pulse>NF+1) pulse=-1; }
  const pz = pulse>=0 ? (NF*SL)*(pulse/(NF+1)) : -1e9;
  coreMat.color.setHSL(0.58,0.5,0.10+(pulse>=0?0.62*Math.exp(-Math.pow((pz-z)/16,2)):0));

  const f=Math.max(0,Math.min(NF-1,Math.floor(z/SL)));
  floorEl.textContent=String(f).padStart(2,'0');
  const [w,p]=WAD.steps[cur].f[f];
  wordEl.textContent=(w||'').replace(/\n/g,'⏎')||'␣';
  const sk=WAD.steps[cur].l[Math.min(f,NL-1)][1];
  sinkEl.textContent=(sk.reduce((a,b)=>a+b,0)/NH*100).toFixed(0)+'%';
  for(const row of lamps) for(const L of row) L.hm.lookAt(camera.position);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
</script>
</body>
